# Cloudflare terminates public TLS; hail serves these virtual hosts internally.
server {
    listen 80;
    listen [::]:80;
    server_name skadi.goblinreactor.com;
    return 308 https://xn--skai-dqa.goblinreactor.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    # skaði.goblinreactor.com, in its DNS/IDNA representation.
    server_name xn--skai-dqa.goblinreactor.com;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://192.168.1.11:8888/skadi.goblinreactor.com/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
